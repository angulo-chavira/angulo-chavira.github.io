<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Blog - Armando Q. Angulo Chavira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Blog personal y notas de investigación de Armando Q. Angulo Chavira" />
  
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <header id="header">
    <div id="header-placeholder"></div>
  </header>

  <div id="layout-container">
    
    <aside id="sidebar">
      <div id="sidebar-placeholder"></div>
    </aside>

    <main id="main-content">
      
      <section class="content-section">
        <h3 class="section-title" data-cms-copy="pageCopy.blog.title" data-i18n="blogTitle">Blog</h3>
        <p data-cms-copy="pageCopy.blog.intro" data-i18n="blogDesc" style="margin-bottom: 40px; color: var(--text-muted);">Reflexiones, noticias y notas breves sobre psicolingüística, ciencia cognitiva y tecnología.</p>
        
        <div id="blogPostsList" class="blog-posts-list">
</div>

      </section>

    </main>
  </div>

  <footer id="footer-placeholder" class="footer"></footer>

  <script src="main.js"></script>
  <script src="site-content.js"></script>

</body>
</html>
