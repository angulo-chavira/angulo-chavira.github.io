<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publicaciones — Armando Q. Angulo Chavira</title>
  <meta name="description" content="Publicaciones académicas de Armando Q. Angulo Chavira con filtros por año, tema y autoría." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header id="header"><div id="header-placeholder"></div></header>
  <div id="layout-container">
    <aside id="sidebar"><div id="sidebar-placeholder"></div></aside>
    <main id="main-content">
      <section class="content-section">
        <h1 class="section-title" data-cms-copy="pageCopy.publications.title" data-i18n="pubsTitle">Publicaciones</h1>
        <p class="pubs-intro" data-cms-copy="pageCopy.publications.intro" data-i18n="pubsDesc">Explora la lista por año, tema y tipo de autoría. Los resúmenes y etiquetas se pueden completar o actualizar desde el administrador de contenidos.</p>
        <div class="pub-tools" role="search">
          <input id="pubSearch" type="search" autocomplete="off" placeholder="Buscar por título, autor, revista o palabra clave" aria-label="Buscar publicaciones" />
          <select id="yearFilter" aria-label="Filtrar por año"><option value="">Todos los años</option></select>
          <select id="tagFilter" aria-label="Filtrar por tema"><option value="">Todos los temas</option></select>
        </div>
        <div class="pub-filter-row">
          <label class="check-label"><input id="firstAuthorFilter" type="checkbox" /> <span id="firstAuthorLabel">Primer autor</span></label>
          <label class="check-label"><input id="correspondingFilter" type="checkbox" /> <span id="correspondingLabel">Autor de correspondencia</span></label>
          <label class="check-label"><span id="sortLabel">Orden</span>
            <select id="sortOrder" aria-label="Ordenar publicaciones" style="min-height:36px;padding:5px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)">
              <option value="newest">Más recientes</option><option value="oldest">Más antiguas</option>
            </select>
          </label>
          <button id="clearFilters" class="delete-button" type="button">Limpiar filtros</button>
        </div>
        <p id="resultsCount" class="results-line" aria-live="polite">Cargando publicaciones…</p>
        <div id="publicationList" class="pub-list" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <footer id="footer-placeholder" class="footer"></footer>
  <script src="main.js"></script>
  <script src="site-content.js"></script>
  <script src="publications.js"></script>
</body>
</html>
